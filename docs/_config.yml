# GitHub Pages site for InkContracts+.
# Publish: repo Settings → Pages → Source "Deploy from a branch" → branch `main` (or master), folder `/docs`.
# The site is then at https://<user>.github.io/<repo>/  (set `url` / `baseurl` below to match).

title: InkContracts+
description: Player-run job board for Paper servers. Escrowed rewards, verified work, reputation and fully customisable menus.
lang: en

# baseurl is the repo name, e.g. "/InkContractsPlus". Leave empty for a user/organisation site or a custom domain.
baseurl: "/InkContractsPlus"
url: ""

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: inkcontracts
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Shown top right. Set this to your repo / Modrinth page once they're public.
aux_links:
  "Modrinth":
    - "https://modrinth.com/plugin/inkcontracts"
aux_links_new_tab: true

footer_content: "InkContracts+ documentation. Not an official Minecraft product; not approved by or associated with Mojang or Microsoft."

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow

exclude:
  - README.md
